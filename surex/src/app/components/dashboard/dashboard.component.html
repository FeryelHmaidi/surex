<div class="main-content">
  
  <div class="top-bar">
    <div class="page-title">
      <h1>{{ mainTitle }}</h1>
      <p>{{ subTitle }}</p>
    </div>

    <div class="user-info">
      <div class="actor-selector">
        <label for="actorSelect">👤 Rôle :</label>
        <select
          id="actorSelect"
          [value]="currentActor"
          (change)="onActorChange($any($event.target).value)"
        >
          <option value="importateur">Importateur</option>
          <option value="banque">Banque</option>
          <option value="agent">Agent Maritime</option>
        </select>
      </div>
      <div class="avatar">{{ currentActor.charAt(0).toUpperCase() }}</div>
    </div>
  </div>

  
  <app-kpi-grid [kpiData]="kpiData"></app-kpi-grid>

  <!-- Filters Bar -->
  <app-filters></app-filters>

  
  <app-tabs></app-tabs>

  
  <app-transactions-table
    [transactions]="filteredTransactions"
    [currentActor]="currentActor"
  ></app-transactions-table>
</div>
